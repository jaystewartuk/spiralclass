# Local Postgres for the Vitest integration project (`pnpm db:test:up`).
#
# `pnpm test:integration` reads TEST_DATABASE_URL from .env.test and
# runs handler-level tests against this container. The default
# `pnpm test` (unit only) doesn't touch this — keeps the per-push run
# fast.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d   # boot
#   docker compose -f docker-compose.test.yml down -v # wipe + stop
#
# Port 5433 so this never collides with the DEV database on 5432
# (docker-compose.dev.yml). Running both at once is the normal case:
# `pnpm dev` against one, `pnpm test:integration:local` against the other.

services:
  test-db:
    image: postgres:16
    container_name: spiralclass-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: spiralclass_test
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d spiralclass_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  test-db-data:
